services:
  mono-actual-sync:
    image: ghcr.io/denysochek/mono-actual-sync-actual:latest
    container_name: mono-actual-sync
    ports:
      - "9191:9191"
    environment:
      PORT: "9191"
      TZ: "Europe/Kyiv"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    volumes:
      - mono_actual_sync_data:/app/backend/data
    restart: unless-stopped

volumes:
  mono_actual_sync_data:
